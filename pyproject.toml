[project]
name = "sakshi"
version = "0.2.0"
description = "SocioBurp's WhatsApp AI marketing-creative bot for SMBs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "httpx>=0.27",
  "anthropic>=0.40",
  "voyageai>=0.3",
  "boto3>=1.35",
  "jinja2>=3.1",
  "playwright>=1.48",
  "redis>=5.2",
  "python-multipart>=0.0.12",
  "structlog>=24.4",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "respx>=0.21"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# setuptools cannot guess the package when app/, migrations/, templates/ and
# samples/ all sit at the top level, so `pip install -e .` is told explicitly.
[tool.setuptools.packages.find]
include = ["app*"]
